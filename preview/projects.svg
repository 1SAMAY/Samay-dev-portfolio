<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Projects preview">

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071016"/>
      <stop offset="100%" stop-color="#0f1724"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="60" y="80" font-family="monospace" font-size="20" fill="#8ef0c8">
    FEATURED PROJECTS
  </text>

  <!-- Cards -->
  <rect x="60" y="110" width="400" height="560" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(188,214,233,0.12)"/>
  <rect x="500" y="110" width="400" height="560" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(188,214,233,0.12)"/>
  <rect x="940" y="110" width="380" height="560" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(188,214,233,0.12)"/>

  <!-- CARD 1 -->
  <text x="90" y="160" font-family="monospace" font-size="13" fill="#9fb0be">
    LIVE 01  AI - PRODUCTIVITY
  </text>

  <text x="90" y="210" font-family="sans-serif" font-size="26" font-weight="700" fill="#eef4f8">
    PERSONAL AI
  </text>
  <text x="90" y="240" font-family="sans-serif" font-size="26" font-weight="700" fill="#eef4f8">
    ASSISTANT
  </text>

  <text x="90" y="280" font-family="monospace" font-size="15" fill="#9fb0be">
    Intelligent assistant for productivity,
  </text>
  <text x="90" y="305" font-family="monospace" font-size="15" fill="#9fb0be">
    task handling, and workflow support.
  </text>

  <!-- Tags -->
  <rect x="90" y="340" width="90" height="32" rx="16" fill="rgba(142,240,200,0.12)"/>
  <text x="135" y="360" font-size="11" fill="#8ef0c8" text-anchor="middle">AI</text>

  <rect x="190" y="340" width="120" height="32" rx="16" fill="rgba(122,169,255,0.12)"/>
  <text x="250" y="360" font-size="11" fill="#7aa9ff" text-anchor="middle">Automation</text>

  <!-- CARD 2 -->
  <text x="530" y="160" font-family="monospace" font-size="13" fill="#9fb0be">
    LIVE 02  BROWSER EXTENSION
  </text>

  <text x="530" y="210" font-family="sans-serif" font-size="24" font-weight="700" fill="#eef4f8">
    MEDIA DOWNLOADER
  </text>
  <text x="530" y="240" font-family="sans-serif" font-size="24" font-weight="700" fill="#eef4f8">
    EXTENSION
  </text>

  <text x="530" y="280" font-family="monospace" font-size="15" fill="#9fb0be">
    Fast browser extension for media capture
  </text>
  <text x="530" y="305" font-family="monospace" font-size="15" fill="#9fb0be">
    and quick downloads.
  </text>

  <!-- Tags -->
  <rect x="530" y="340" width="120" height="32" rx="16" fill="rgba(142,240,200,0.12)"/>
  <text x="590" y="360" font-size="11" fill="#8ef0c8" text-anchor="middle">Extension</text>

  <rect x="660" y="340" width="90" height="32" rx="16" fill="rgba(255,184,107,0.12)"/>
  <text x="705" y="360" font-size="11" fill="#ffb86b" text-anchor="middle">Tools</text>

  <!-- CARD 3 -->
  <text x="970" y="160" font-family="monospace" font-size="13" fill="#9fb0be">
    LIVE 03  GAME STORE
  </text>

  <text x="970" y="210" font-family="sans-serif" font-size="26" font-weight="700" fill="#eef4f8">
    GAME STORE
  </text>

  <text x="970" y="260" font-family="monospace" font-size="15" fill="#9fb0be">
    Epic-style storefront with browsing,
  </text>
  <text x="970" y="285" font-family="monospace" font-size="15" fill="#9fb0be">
    cards, and product presentation.
  </text>

  <!-- Tags -->
  <rect x="970" y="320" width="120" height="32" rx="16" fill="rgba(142,240,200,0.12)"/>
  <text x="1030" y="340" font-size="11" fill="#8ef0c8" text-anchor="middle">E-commerce</text>

  <rect x="1100" y="320" width="80" height="32" rx="16" fill="rgba(122,169,255,0.12)"/>
  <text x="1140" y="340" font-size="11" fill="#7aa9ff" text-anchor="middle">UI</text>

  <!-- Bottom Bar -->
  <rect x="60" y="720" width="1260" height="80" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(188,214,233,0.12)"/>

  <text x="90" y="765" font-family="monospace" font-size="16" fill="#9fb0be">
    Show more projects
  </text>

  <text x="1100" y="765" font-family="monospace" font-size="16" fill="#8ef0c8">
    DEVDOCK + Coming Soon
  </text>

</svg>

  <rect x="500" y="120" width="420" height="560" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(188,214,233,0.12)"/>
  <rect x="940" y="120" width="400" height="560" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(188,214,233,0.12)"/>

